name = "transferneves"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "transferneves"
database_id = "8e3e9320-5e2d-470e-8dec-d5b21041d0f6"

[[r2_buckets]]
binding = "FILES"
bucket_name = "transferneves"

[vars]
ENVIRONMENT = "development"
# JWT_SECRET local para desenvolvimento — em produção use: wrangler secret put JWT_SECRET
JWT_SECRET = "transferneves-dev-secret-mude-em-producao-12345"

# Para rodar localmente com D1 local, use: wrangler dev --local
# O database_id só é necessário para wrangler deploy (remoto)
